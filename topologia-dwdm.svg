<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="580" viewBox="0 0 1360 580" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1360" height="580" fill="#f8fafc" rx="12"/>
  <text x="680" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MAQUETA DE LABORATORIO DWDM — TOPOLOGÍA FÍSICA Y FLUJO DE SEÑAL</text>
  <text x="680" y="66" text-anchor="middle" font-size="13" fill="#475569">INACAP La Serena | Red de Transporte Óptico Punto a Punto Bidireccional (Banda C — ITU-T G.694.1)</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <!-- MTX150x -->
  <rect x="35" y="130" width="165" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="117" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Analizador Ethernet</text>
  <text x="117" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">VeEX MTX150x</text>
  <text x="117" y="200" text-anchor="middle" font-size="11" fill="#334155">RFC 2544 / Y.1564 / BER</text>

  <!-- CSS610 -->
  <rect x="245" y="130" width="175" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="332" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Switch Ethernet</text>
  <text x="332" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">MikroTik CSS610</text>
  <text x="332" y="200" text-anchor="middle" font-size="11" fill="#334155">8x GbE + 2x SFP+ 10G</text>

  <!-- HT6000 #1 -->
  <rect x="470" y="120" width="190" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Chasis DWDM 1</text>
  <text x="565" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">HT6000 (Nodo A)</text>
  <text x="565" y="193" text-anchor="middle" font-size="11" fill="#334155">OTU + MUX/DEMUX</text>
  <text x="565" y="210" text-anchor="middle" font-size="10" fill="#475569">Cliente Gris ↔ Línea Banda C</text>

  <!-- ODF -->
  <rect x="720" y="120" width="175" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="807" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">ODF</text>
  <text x="807" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Optical Distribution Frame</text>
  <text x="807" y="194" text-anchor="middle" font-size="11" fill="#334155">Panel Parcheo LC/UPC-APC</text>
  <text x="807" y="211" text-anchor="middle" font-size="10" fill="#475569">Puertos A1/A2 ↔ B1/B2</text>

  <!-- Spool AB -->
  <rect x="650" y="310" width="180" height="75" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="740" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Carrete Fibra AB</text>
  <text x="740" y="360" text-anchor="middle" font-size="12" fill="#991b1b">25 KM — ITU-T G.652.D</text>
  <text x="740" y="376" text-anchor="middle" font-size="10" fill="#475569">Sentido A → B (~5 dB)</text>

  <!-- OVA -->
  <rect x="885" y="310" width="185" height="75" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="977" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">Atenuador Variable</text>
  <text x="977" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">OVA JW3303</text>
  <text x="977" y="376" text-anchor="middle" font-size="10" fill="#475569">Ajuste 0 – 60 dB @ 1550 nm</text>

  <!-- Spool BA -->
  <rect x="760" y="445" width="210" height="75" rx="8" fill="#fee2e2" stroke="#2563eb" stroke-width="2"/>
  <text x="865" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Carrete Fibra BA</text>
  <text x="865" y="495" text-anchor="middle" font-size="12" fill="#1d4ed8">25 KM — ITU-T G.652.D</text>
  <text x="865" y="511" text-anchor="middle" font-size="10" fill="#475569">Sentido Retorno B → A (~5 dB)</text>

  <!-- HT6000 #2 -->
  <rect x="1135" y="120" width="190" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1230" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Chasis DWDM 2</text>
  <text x="1230" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">HT6000 (Nodo B)</text>
  <text x="1230" y="193" text-anchor="middle" font-size="11" fill="#334155">DEMUX/MUX + OTU</text>
  <text x="1230" y="210" text-anchor="middle" font-size="10" fill="#475569">Loopback Cliente TX ↔ RX</text>

  <!-- OSA -->
  <rect x="1135" y="310" width="190" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1230" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Analizador Espectro</text>
  <text x="1230" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">OSA VeEX RXT4510</text>
  <text x="1230" y="378" text-anchor="middle" font-size="10" fill="#475569">Potencia Ch / OSNR (MON)</text>

  <!-- Connections -->
  <line x1="200" y1="175" x2="242" y2="175" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <text x="221" y="164" text-anchor="middle" font-size="10" fill="#1e3a8a">SFP/SFP+</text>

  <line x1="420" y1="175" x2="467" y2="175" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <text x="444" y="164" text-anchor="middle" font-size="10" fill="#1e3a8a">Cliente</text>

  <line x1="660" y1="175" x2="717" y2="175" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" marker-start="url(#arrow-blue)"/>
  <text x="689" y="164" text-anchor="middle" font-size="10" fill="#991b1b">LINE</text>

  <!-- ODF -> Spool AB -->
  <path d="M 770 230 L 770 307" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <!-- Spool AB -> OVA -->
  <line x1="830" y1="348" x2="882" y2="348" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <!-- OVA -> HT6000 #2 -->
  <path d="M 1070 348 L 1095 348 L 1095 160 L 1132 160" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>

  <!-- HT6000 #2 -> OSA (MON) -->
  <line x1="1230" y1="230" x2="1230" y2="307" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrow-orange)"/>
  <text x="1265" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">MON (-20dB)</text>

  <!-- Return path HT6000 #2 -> Spool BA -> ODF -->
  <path d="M 1135 200 L 1110 200 L 1110 482 L 973 482" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 760 482 L 620 482 L 620 265 L 825 265 L 825 233" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- Legend -->
  <rect x="35" y="455" width="460" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="478" font-size="12" font-weight="bold" fill="#0f172a">Leyenda de enlaces:</text>
  <line x1="52" y1="496" x2="92" y2="496" stroke="#dc2626" stroke-width="2.5"/>
  <text x="102" y="500" font-size="11" fill="#334155">Tramo Óptico DWDM Sentido A → B (Carrete AB + OVA)</text>
  <line x1="52" y1="518" x2="92" y2="518" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="102" y="522" font-size="11" fill="#334155">Tramo Óptico DWDM Sentido B → A (Retorno Carrete BA) y Cliente</text>
</svg>
